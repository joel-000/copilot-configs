name: CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "copilot/**"
      - "scripts/**"
      - ".github/**"
  push:
    branches:
      - master
    paths:
      - "copilot/**"
      - "scripts/**"
      - ".github/**"
  workflow_dispatch:

jobs:
  validate-pack:
    uses: ./.github/workflows/reusable-validate-pack.yml
    permissions:
      contents: read

  test-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Smoke test installer (safe merge)
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          bash scripts/repo_install.sh "$target"
          test -d "$target/.github/agents"
          test -d "$target/.github/instructions"
          test -d "$target/.github/skills"

      - name: Verify installer idempotency
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          bash scripts/repo_install.sh "$target"
          first_checksum="$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C "$target/.github" . | sha256sum | cut -d' ' -f1)"
          bash scripts/repo_install.sh "$target"
          second_checksum="$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C "$target/.github" . | sha256sum | cut -d' ' -f1)"
          test "$first_checksum" = "$second_checksum"

      - name: Verify prune mode removes unmanaged files
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          mkdir -p "$target/.github"
          printf "keep me\n" > "$target/.github/unmanaged-file.txt"
          bash scripts/repo_install.sh --prune --confirm-prune "$target"
          test ! -f "$target/.github/unmanaged-file.txt"

      - name: Verify installer rejects symlinked .github targets
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          ln -s /tmp "$target/.github-link"
          if bash scripts/repo_install.sh "$target/.github-link"; then
            echo "Expected installer to reject symlinked .github target."
            exit 1
          fi
          if bash scripts/repo_install.sh "$target/.github-link/"; then
            echo "Expected installer to reject symlinked .github/ target with trailing slash."
            exit 1
          fi

      - name: Smoke test global installer links
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          repo_root="$(pwd)"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home"
          test -L "$copilot_home/instructions"
          test -L "$copilot_home/agents"
          test -L "$copilot_home/skills"
          test "$(readlink "$copilot_home/instructions")" = "$repo_root/copilot/instructions"
          test "$(readlink "$copilot_home/agents")" = "$repo_root/copilot/agents"
          test "$(readlink "$copilot_home/skills")" = "$repo_root/copilot/skills"
          test "$(readlink "$copilot_home/copilot-instructions.md")" = "$repo_root/copilot/copilot-instructions.md"

      - name: Verify global installer idempotency
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home"
          first_snapshot="$(find "$copilot_home" -mindepth 1 -maxdepth 1 -printf '%f:%l\n' | sort)"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home"
          second_snapshot="$(find "$copilot_home" -mindepth 1 -maxdepth 1 -printf '%f:%l\n' | sort)"
          test "$first_snapshot" = "$second_snapshot"

      - name: Verify global installer removes owned legacy prompt link
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          repo_root="$(realpath -m "$(pwd)")"
          legacy_target="${repo_root}/copilot/prompts"
          ln -s "${legacy_target}" "$copilot_home/prompts"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home"
          test ! -L "$copilot_home/prompts"

      - name: Verify global installer removes prior-install legacy prompt link
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          old_root_base="$(mktemp -d)"
          old_root="${old_root_base}/copilot"
          mkdir -p "${old_root}/agents" "${old_root}/instructions" "${old_root}/skills"
          printf "legacy\n" > "${old_root}/copilot-instructions.md"
          ln -s "${old_root}/agents" "$copilot_home/agents"
          ln -s "${old_root}/instructions" "$copilot_home/instructions"
          ln -s "${old_root}/skills" "$copilot_home/skills"
          ln -s "${old_root}/copilot-instructions.md" "$copilot_home/copilot-instructions.md"
          ln -s "${old_root}/prompts" "$copilot_home/prompts"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home" --force
          test ! -L "$copilot_home/prompts"

      - name: Verify global installer removes canonicalized legacy prompt link
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          repo_root="$(realpath -m "$(pwd)")"
          legacy_target="${repo_root}/copilot/prompts"
          ln -s "${legacy_target}/../prompts" "$copilot_home/prompts"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home"
          test ! -L "$copilot_home/prompts"

      - name: Verify global installer preserves unrelated prompt link
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          unrelated_root="$(mktemp -d)/copilot"
          ln -s "${unrelated_root}/agents" "$copilot_home/agents"
          ln -s "${unrelated_root}/prompts" "$copilot_home/prompts"
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home" --force
          test -L "$copilot_home/prompts"
          test "$(readlink "$copilot_home/prompts")" = "${unrelated_root}/prompts"

      - name: Verify global installer force-replaces conflicts
        run: |
          set -euo pipefail
          copilot_home="$(mktemp -d)"
          repo_root="$(pwd)"
          mkdir -p "$copilot_home/skills"
          printf "stale skill config\n" > "$copilot_home/skills/old.txt"
          ln -s /tmp/stale-agent-config "$copilot_home/agents"
          if bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home"; then
            echo "Expected installer to fail when managed paths conflict without --force."
            exit 1
          fi
          bash scripts/global_install.sh --allow-outside-home --copilot-home "$copilot_home" --force
          test -L "$copilot_home/agents"
          test -L "$copilot_home/skills"
          test "$(readlink "$copilot_home/agents")" = "$repo_root/copilot/agents"
          test "$(readlink "$copilot_home/skills")" = "$repo_root/copilot/skills"

  validator-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Ensure validator ignores legacy prompt artifacts
        run: |
          set -euo pipefail
          fixture_file="copilot/prompts/zz-regression-bad-agent.prompt.md"
          mkdir -p "$(dirname "$fixture_file")"
          cat > "$fixture_file" <<'EOF'
          ---
          name: 'Regression fixture'
          description: 'Intentionally invalid prompt for validator regression checks'
          agent: 'Nonexistent Agent Name'
          ---

          This file intentionally contains an invalid agent reference.
          EOF

          cleanup() {
            rm -f "$fixture_file"
            rmdir "$(dirname "$fixture_file")" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! python scripts/validate.py; then
            echo "Validator should ignore legacy prompt artifacts."
            exit 1
          fi

      - name: Ensure validator fails on broken handoff agent references
        run: |
          set -euo pipefail
          fixture_file="copilot/agents/zz-regression-bad-handoff.agent.md"
          cat > "$fixture_file" <<'EOF'
          ---
          name: 'Regression Handoff Fixture'
          description: 'Intentionally invalid handoff target for validator regression checks'
          tools: ['read']
          handoffs:
            - label: Broken handoff
              agent: nonexistent-agent
              prompt: 'This should fail validation.'
              send: false
          ---

          This file intentionally contains an invalid handoff reference.
          EOF

          if python scripts/validate.py; then
            echo "Expected validator failure, but it passed."
            rm -f "$fixture_file"
            exit 1
          fi

          rm -f "$fixture_file"

      - name: Ensure validator does not require root/source file mirroring
        run: |
          set -euo pipefail
          root_file=".github/agents/implementer.agent.md"
          source_file="copilot/agents/implementer.agent.md"
          tmp_created=false

          if [ ! -f "$root_file" ]; then
            mkdir -p "$(dirname "$root_file")"
            cp "$source_file" "$root_file"
            tmp_created=true
          fi

          cleanup() {
            if [ "$tmp_created" = true ]; then
              rm -f "$root_file"
            else
              git checkout -- "$root_file" || true
            fi
          }
          trap cleanup EXIT

          printf "\nTemporary drift line for regression check.\n" >> "$root_file"
          if ! python scripts/validate.py; then
            echo "Validator should not fail on root/source content drift."
            exit 1
          fi
